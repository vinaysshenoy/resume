<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light" />
<title>Vinay Shenoy — Engineering Lead</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #ffffff;
    --text: #202124;
    --text-muted: #4b4f56;
    --text-faint: #6b7280;
    --accent: #3cae6e;
    --heading: #262b38;
    --border: #e3e4e7;
    --max-width: 780px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 3rem 1.5rem 5rem;
    background: var(--bg);
    color: var(--text);
    font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .resume {
    max-width: var(--max-width);
    margin: 0 auto;
  }

  .top-bar {
    height: 7px;
    background: var(--accent);
    border-radius: 2px;
    margin-bottom: 2rem;
  }

  header.hero {
    margin-bottom: 2.5rem;
  }

  h1 {
    font-size: 2.6rem;
    font-weight: 500;
    margin: 0 0 0.1rem;
    letter-spacing: -0.01em;
    color: var(--heading);
  }

  .title {
    font-size: 1.35rem;
    color: var(--accent);
    font-weight: 600;
    margin: 0 0 0.9rem;
  }

  .contact {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
    font-size: 0.95rem;
    color: var(--text-faint);
  }

  .contact a { color: inherit; text-decoration: none; }
  .contact a:hover { color: var(--accent); text-decoration: underline; }

  .contact .contact-label { color: var(--text-faint); }

  section {
    margin-bottom: 2.3rem;
  }

  h2.section-title {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 1rem;
  }

  .summary p {
    margin: 0;
    color: var(--text);
    font-size: 1rem;
  }

  .job {
    margin-bottom: 1.9rem;
    position: relative;
    break-inside: avoid;
    page-break-inside: avoid;
  }

  .job:last-child { margin-bottom: 0; }

  .job-header {
    margin-bottom: 0.5rem;
  }

  .job-title-block {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.35rem;
    font-size: 1.1rem;
  }

  .company {
    font-weight: 700;
    color: var(--heading);
  }

  .role {
    font-weight: 400;
    color: var(--text);
  }

  .role::before {
    content: "/ ";
    color: var(--text-faint);
  }

  .meta {
    display: block;
    font-size: 0.82rem;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-top: 0.2rem;
  }

  .intro {
    margin: 0.7rem 0 0.7rem;
    color: var(--text);
    font-size: 1rem;
  }

  ul.highlights {
    margin: 0.3rem 0 0.7rem;
    padding-left: 1.3rem;
  }

  ul.highlights li {
    margin-bottom: 0.6rem;
    font-size: 0.98rem;
    color: var(--text);
  }

  ul.highlights li:last-child { margin-bottom: 0; }

  ul.highlights a { color: var(--accent); }

  .stack {
    font-size: 0.88rem;
    color: var(--text-muted);
    margin-top: 0.6rem;
  }

  .stack strong {
    color: var(--heading);
    font-weight: 600;
  }

  .edu-item, .school-item {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.25rem 1rem;
  }

  .edu-item .company, .school-item .company {
    font-size: 1rem;
  }

  .pdf-button {
    position: fixed;
    top: 1.25rem;
    right: 1.25rem;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.6rem 1rem;
    background: var(--accent);
    color: #ffffff;
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 600;
    border: none;
    border-radius: 999px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    cursor: pointer;
    z-index: 100;
  }

  .pdf-button:hover {
    filter: brightness(1.08);
  }

  @media print {
    body { padding: 0.5in; }
    a { color: inherit; text-decoration: none; }
    section { break-inside: avoid; }
    .job { break-inside: avoid; }
    .pdf-button { display: none; }
  }

  @media (max-width: 480px) {
    h1 { font-size: 2rem; }
  }
</style>
</head>
<body>
<button class="pdf-button" id="pdf-button">Download PDF</button>
<div class="resume" id="app"></div>
<script src="vendor/html2pdf.bundle.min.js"></script>
<script src="render.js"></script>
</body>
</html>
