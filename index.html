<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light" />
<title>Vinay Shenoy — Engineering Lead</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="resume.css" />
</head>
<body>
<div class="toolbar" id="toolbar">
  <span class="toolbar-title">Resume preview</span>
  <div class="toolbar-actions">
    <input type="file" id="file-input" accept=".json,application/json" hidden />
    <button type="button" id="load-button">Load resume</button>
    <button type="button" id="edit-button">Edit JSON</button>
    <button type="button" id="refresh-button">Refresh</button>
    <button type="button" class="pdf-button" id="pdf-button">Download PDF</button>
  </div>
</div>
<div class="editor-drawer" id="editor-drawer" hidden>
  <textarea id="json-editor" spellcheck="false" aria-label="Resume JSON"></textarea>
  <div class="editor-error" id="editor-error"></div>
</div>
<div class="resume" id="app"></div>
<script src="render.js"></script>
</body>
</html>
